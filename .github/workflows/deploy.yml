name: deploy-xingye

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 三种情况，自动决定 base / url / CNAME：
      #   1) 有自定义域名（仓库变量 XINGYE_DOMAIN，或 content/site.json 的 domain）→ 根路径 + 写 CNAME
      #   2) 仓库名是 <owner>.github.io → 根路径
      #   3) 其它（项目站）→ /<repo> 子路径
      - name: Resolve deployment target
        id: target
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          domain="${{ vars.XINGYE_DOMAIN }}"
          if [ -z "$domain" ]; then
            domain="$(node -p "require('./content/site.json').domain || ''" 2>/dev/null || true)"
          fi
          if [ -n "$domain" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "url=https://${domain}" >> "$GITHUB_OUTPUT"
            echo "domain=${domain}" >> "$GITHUB_OUTPUT"
            echo "→ 自定义域名 ${domain}"
          elif [ "$repo" = "${owner}.github.io" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
            echo "domain=" >> "$GITHUB_OUTPUT"
            echo "→ 用户站根路径"
          else
            echo "base=/${repo}" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"
            echo "domain=" >> "$GITHUB_OUTPUT"
            echo "→ 项目站子路径 /${repo}"
          fi

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: node build.mjs
        env:
          XINGYE_BASE: ${{ steps.target.outputs.base }}
          XINGYE_URL: ${{ steps.target.outputs.url }}
          XINGYE_DOMAIN: ${{ steps.target.outputs.domain }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
