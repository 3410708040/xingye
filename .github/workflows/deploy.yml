name: deploy-xingye

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 项目站部署在 https://<owner>.github.io/<repo>/ —— 自动推导子路径与正式域名，
      # 也可以用仓库变量 XINGYE_URL / XINGYE_BASE 覆盖（例如绑了自定义域名时）。
      - name: Resolve deployment base
        id: base
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${owner}.github.io" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${repo}" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io/${repo}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: node build.mjs
        env:
          XINGYE_BASE: ${{ vars.XINGYE_BASE || steps.base.outputs.base }}
          XINGYE_URL: ${{ vars.XINGYE_URL || steps.base.outputs.url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
